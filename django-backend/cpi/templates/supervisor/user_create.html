{% extends "supervisor/base.html" %}

{% block title %}Create User{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Create User</h2>
            <p class="text-muted mb-0">
                Create a new CPI system user.
            </p>
        </div>

        <a href="{% url 'supervisor-users' %}"
           class="btn btn-outline-secondary">
            Back to Users
        </a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="full_name" class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="full_name"
                            name="full_name"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            required
                            autocomplete="username"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="phone_number" class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="phone_number"
                            name="phone_number"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="role" class="form-label">
                            Role
                        </label>

                        <select
                            class="form-select"
                            id="role"
                            name="role"
                            required
                        >
                            <option value="">Select role</option>

                            {% for value, label in role_choices %}
                                <option value="{{ value }}">
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="assigned_island" class="form-label">
                            Assigned Island
                        </label>

                        <select
                            class="form-select"
                            id="assigned_island"
                            name="assigned_island"
                        >
                            <option value="">No island assigned</option>

                            {% for island in islands %}
                                <option value="{{ island.pk }}">
                                    {{ island.island_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="confirm_password" class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                </div>

                <div class="d-flex justify-content-end gap-2 mt-3">

                    <a href="{% url 'supervisor-users' %}"
                       class="btn btn-light">
                        Cancel
                    </a>

                    <button type="submit"
                            class="btn btn-primary">
                        Create User
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
